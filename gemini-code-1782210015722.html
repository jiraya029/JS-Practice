<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            padding: 20px;
        }

        /* The Glass Card */
        .welcome-card {
            background: rgba(255, 255, 255, 0.92);
            padding: 3.5rem 4rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 580px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            background-color: #ede9fe;
            color: #6d28d9;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2.6rem;
            color: #1e1b4b;
            margin-bottom: 1rem;
            line-height: 1.2;
            font-weight: 800;
        }

        p {
            color: #4b5563;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.2rem;
        }

        /* Button Layout */
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 0.85rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #4b5563;
            border: 2px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background-color: #f3f4f6;
            color: #111827;
            border-color: #d1d5db;
        }

        /* Responsive styling for small screens */
        @media (max-width: 480px) {
            .welcome-card {
                padding: 2.5rem 1.5rem;
            }
            h1 { font-size: 2rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <span class="badge">Welcome Aboard</span>
        <h1>Great things start with a simple hello.</h1>
        <p>We are thrilled to have you here. Explore our platform, discover new possibilities, and start building something amazing today.</p>
        
        <div class="btn-group">
            <a href="#" class="btn btn-primary">Get Started</a>
            <a href="#" class="btn btn-secondary">Learn More</a>
        </div>
    </div>

</body>
</html>
